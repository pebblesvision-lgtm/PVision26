[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvsketch"
version = "0.1.0"
description = "Photo to true-scale production outline (SVG/DXF in mm) for stone restoration - fully offline"
requires-python = ">=3.10"
dependencies = [
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "flask>=3.0",
  "ezdxf>=1.1",
  "pillow>=10.0",
]

[project.scripts]
pvsketch = "pvsketch.__main__:main"

[tool.setuptools.packages.find]
include = ["pvsketch*"]

[tool.setuptools.package-data]
"pvsketch.server" = ["templates/*.html", "static/*"]
